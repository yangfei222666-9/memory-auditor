name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Node and cross-implementation contracts
        run: npm test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproduction package contract tests
        working-directory: repro_v0
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REPRO_TEST_ENGINE: ./pinned-engine.py
          REPRO_SOURCE_ROOT: ..
        run: python -B -m unittest discover -s . -p test_contract.py -v
